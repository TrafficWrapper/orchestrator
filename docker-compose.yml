services:
  signer:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["signer"]
    environment:
      ORCH_STATE_DIR: /signer-state
      ORCH_SIGNER_KEY_PATH: /signer-state/orch-config.key
      # One-time migration of a key created by older releases inside the
      # shared orchestrator state; it is moved out and deleted there.
      ORCH_SIGNER_LEGACY_KEY_PATH: /orch-state/orch-config.key
      ORCH_SIGNER_SOCKET: /run/tw-signer/signer.sock
    network_mode: none
    volumes:
      - ./signer-state:/signer-state
      - ./signer-run:/run/tw-signer
      - ./orch-state:/orch-state
    restart: unless-stopped

  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["serve"]
    depends_on:
      - signer
    environment:
      ORCH_STATE_DIR: /orch-state
      ORCH_SIGNER_SOCKET: /run/tw-signer/signer.sock
      ORCH_LISTEN: ${ORCH_LISTEN:-:9091}
      ORCH_TLS: ${ORCH_TLS:-1}
      ORCH_PUBLIC_URL: ${ORCH_PUBLIC_URL:-https://127.0.0.1:9091}
      ORCH_EGRESS_PROBE_URL: ${ORCH_EGRESS_PROBE_URL:-http://127.0.0.1:9090/self-describe}
      ORCH_UPDATE_PUBKEY: ${ORCH_UPDATE_PUBKEY:-}
      SEED_APK_PATH: ${SEED_APK_PATH:-/seed/app.apk}
      SEED_APK_VERSION_CODE: ${SEED_APK_VERSION_CODE:-1}
      SEED_APK_VERSION_NAME: ${SEED_APK_VERSION_NAME:-seed}
    network_mode: host
    volumes:
      - ./orch-state:/orch-state
      - ./signer-run:/run/tw-signer
      - ./seed:/seed:ro
    restart: unless-stopped
